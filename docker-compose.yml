version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: campusbot-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-campusbot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campusbot-network

  redis:
    image: redis:7-alpine
    container_name: campusbot-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campusbot-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusbot-backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn campusbot.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - campusbot-network

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusbot-celery
    command: celery -A campusbot worker -l info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - backend
    networks:
      - campusbot-network

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusbot-celery-beat
    command: celery -A campusbot beat -l info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - backend
    networks:
      - campusbot-network

  nginx:
    image: nginx:alpine
    container_name: campusbot-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/static:ro
      - media_volume:/media:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - campusbot-network

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  campusbot-network:
    driver: bridge
